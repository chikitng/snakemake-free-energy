# Pre-commit hooks configuration
# Install hooks with: pixi run install-hooks
# Run hooks manually with: pixi run run-hooks

repos:
  # YAML formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  # Linting and formatting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: ["--fix"]
        files: scripts/
      - id: ruff-format
        files: scripts/

ci:
  autofix_commit_msg: "refactor: auto-formatting with pre-commit hooks"
  autofix_prs: true
